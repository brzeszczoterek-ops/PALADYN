[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v-core"
version = "0.7.8"
description = "PALADYN Framework powered by V"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",

    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",

    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[project.scripts]
v-core = "v_core.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
